name: Travel Radar - execução horária

on:
  schedule:
    - cron: "0 * * * *"   # toda hora, em ponto (UTC)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write   # precisa pra commitar/publicar o docs/ atualizado

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dataset de aeroportos (OurAirports, domínio público)
        run: |
          mkdir -p data/reference
          curl -sL "https://davidmegginson.github.io/ourairports-data/airports.csv" -o data/reference/airports.csv
          curl -sL "https://davidmegginson.github.io/ourairports-data/countries.csv" -o data/reference/countries.csv

      - name: Rodar o Travel Radar
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/main.py --tenant marau --max-dates 20 --scheduled

      - name: Publicar docs/ atualizado
        run: |
          git config user.name "travel-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/data.json
          git diff --cached --quiet || git commit -m "Atualiza dashboard (GitHub Actions)"
          git push
